name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install flake8 black
      - run: flake8 src/
      - run: black --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cryptography python3-aiohttp python3-requests python3-dbus libsecret-1-0 gir1.2-secret-1 clamav
      - run: python3 -m unittest discover -s tests -v
