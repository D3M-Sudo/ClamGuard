name: Debian Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper meson
      - run: dpkg-buildpackage -us -uc -b
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ../alpha_*.deb
